services:
  # MCP Server
  # Note: PostgreSQL is deployed externally, not as a container here.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    container_name: mcp-sma-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${MCP_SERVER_PORT:-30020}
      DATABASE_URL: ${DATABASE_URL}
      # Add any other env vars this service needs here
    ports:
      - '${MCP_SERVER_PORT:-30020}:30020'
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:30020/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    container_name: mcp-sma-orchestrator
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${ORCHESTRATOR_PORT:-30021}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:30020}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KEY_ALLOWED_AGENTS: ${KEY_ALLOWED_AGENTS}
      # Add any other env vars this service needs here
    ports:
      - '${ORCHESTRATOR_PORT:-30021}:30021'
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:30021/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge
