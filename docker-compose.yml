services:
  # MCP Server
  # Nota: La base de datos PostgreSQL está deployada externamente
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    container_name: mcp-sma-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${MCP_SERVER_PORT:-3010}
      DATABASE_URL: ${DATABASE_URL}
      # Agrega aquí tus otras variables de entorno
    ports:
      - '${MCP_SERVER_PORT:-3010}:3010'
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3010/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    container_name: mcp-sma-orchestrator
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${ORCHESTRATOR_PORT:-3011}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:3010}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KEY_ALLOWED_AGENTS: ${KEY_ALLOWED_AGENTS}
      # Agrega aquí tus otras variables de entorno
    ports:
      - '${ORCHESTRATOR_PORT:-3011}:3011'
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3011/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge
