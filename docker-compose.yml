services:
  # Local dev-only Postgres+pgvector for services/knowledge-store.
  # knowledge-store itself is NOT containerized here — it needs direct
  # filesystem access to the real vault on the host machine, so it runs
  # natively (`pnpm run dev:knowledge-store`), only pointed at this
  # container's DATABASE_URL. See knowledge-store/001-vectorization/spec.md §7.8.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alma-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alma}
      POSTGRES_DB: ${POSTGRES_DB:-alma}
    ports:
      # Host port 5432 is already taken by an unrelated project's Postgres
      # on this machine (sistema-proyectos-db). 5433 was also tried and,
      # bafflingly, is unreachable specifically for Prisma's engine on this
      # Windows host (TCP connects fine per `docker inspect`/raw socket
      # tests, but Postgres's own connection log never shows the attempt —
      # something below the wire protocol swallows it). 15432 is what
      # actually works — if you need to change this, retest with `npx
      # prisma db execute` before trusting a new port blindly.
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alma}']
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server
  # Note: PostgreSQL is deployed externally, not as a container here.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    container_name: mcp-sma-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${MCP_SERVER_PORT:-30020}
      DATABASE_URL: ${DATABASE_URL}
      # Add any other env vars this service needs here
    ports:
      - '${MCP_SERVER_PORT:-30020}:30020'
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:30020/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    container_name: mcp-sma-orchestrator
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${ORCHESTRATOR_PORT:-30021}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:30020}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KEY_ALLOWED_AGENTS: ${KEY_ALLOWED_AGENTS}
      # Add any other env vars this service needs here
    ports:
      - '${ORCHESTRATOR_PORT:-30021}:30021'
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:30021/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge

volumes:
  postgres-data:
